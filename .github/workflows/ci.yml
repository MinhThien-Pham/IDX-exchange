name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: idx_test
          POSTGRES_PASSWORD: idx_test
          POSTGRES_DB: idx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idx_test -d idx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://idx_test:idx_test@localhost:5432/idx_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run verify:ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_DATABASE_URL: postgresql://idx_test:idx_test@localhost:5432/idx_test
