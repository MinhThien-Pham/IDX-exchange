name: CI

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: idx_test
          POSTGRES_PASSWORD: idx_test
          POSTGRES_DB: idx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idx_test -d idx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://idx_test:idx_test@localhost:5432/idx_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://idx_test:idx_test@localhost:5432/idx_test
